# PRONO SPORT 2.0 — Site statique auto-mis-à-jour (GitHub Pages + Actions)
# GRATUIT à vie : dépôt PUBLIC = minutes illimitées, Pages HTTPS incluses, 0 carte.
name: PRONO SPORT — mise à jour du site

on:
  schedule:
    # Toutes les 6 h, décalées (UTC) : 05:40 / 11:40 / 17:40 / 23:40
    - cron: "40 5,11,17,23 * * *"
  workflow_dispatch: {}     # bouton « Run workflow » = mise à jour à la demande (même au téléphone)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Dépendances
        run: |
          pip install -r backend/requirements.txt
          pip install fastapi "uvicorn[standard]" pillow

      - name: Pipeline données réelles → site statique
        run: bash backend/ci_pipeline.sh

      - name: Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - id: deployment
        uses: actions/deploy-pages@v4
